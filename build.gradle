// Top-level build file.
// Plugins are resolved via the buildscript classpath (Maven Central / Google)
// instead of the Gradle Plugin Portal, because the CI runner cannot reach
// plugins.gradle.org.
buildscript {
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.2.2'
        classpath 'org.jetbrains.kotlin:kotlin-gradle-plugin:1.9.22'
    }
}
